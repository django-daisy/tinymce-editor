[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tinymce-editor"
version = "0.1.0"
description = "A TinyMCE rich text editor for Django forms and admin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Django>=4.2"]

[tool.setuptools.packages.find]
include = ["django_tinymce_editor"]
namespaces = false

[tool.setuptools.package-data]
django_tinymce_editor = ["static/django_tinymce_editor/*"]
