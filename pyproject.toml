[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-toastui-editor"
version = "0.1.0"
description = "A TOAST UI Markdown editor for Django forms and admin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "django_toastui_editor/static/django_toastui_editor/LICENSE.txt"]
dependencies = ["Django>=4.2"]

[project.urls]
Repository = "https://github.com/django-daisy/django-toastui-editor"

[tool.setuptools.packages.find]
include = ["django_toastui_editor"]
namespaces = false

[tool.setuptools.package-data]
django_toastui_editor = ["static/django_toastui_editor/*"]
